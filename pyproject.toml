[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-research-copilot"
version = "0.1.0"
description = "Local hybrid RAG + LangGraph research assistant with evaluation and guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Meiyi Lu"}]
dependencies = [
  "chromadb>=0.5.5",
  "langgraph>=0.2.20",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pypdf>=4.3",
  "rank-bm25>=0.2.2",
  "requests>=2.32",
  "rich>=13.8",
  "sentence-transformers>=3.0",
  "streamlit>=1.38",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
research-copilot = "copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
